name: Validar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Repositorio personalizado de HACS, no de la tienda por defecto:
          # - brands: no está en home-assistant/brands.
          # - license: PolyForm Strict no es una licencia SPDX que GitHub
          #   reconozca (NOASSERTION); es una decisión deliberada.
          ignore: brands license
